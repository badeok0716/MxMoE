[project]
name = "mxmoe"
version = "0.1.0"
description = "Accuracy-Performance Co-design Framework for Mixed-Precision MoE Quantization"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.6.0",
    "transformers==4.52.3",
    "accelerate==1.7.0",
    "datasets==3.6.0",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "einops==0.8.1",
    "gurobipy==12.0.2",
    "jsbeautifier==1.15.4",
    "lm-eval==0.4.5",
    "matplotlib==3.10.3",
    "seaborn==0.13.2",
    "tqdm==4.67.1",
    "pyyaml==6.0.2",
    "ninja==1.11.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mxmoe"]
